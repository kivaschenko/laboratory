[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratory"
version = "1.0.0"
description = "Laboratory Management System for Feed Plant Operations"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Kostiantyn Ivaschenko", email = "kivaschenko@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Framework :: Pyramid",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["laboratory", "management", "pyramid", "chemistry", "inventory"]
dependencies = [
    "pyramid>=2.0",
    "pyramid_jinja2>=2.10",
    "pyramid_debugtoolbar>=4.10",
    "pyramid_retry>=2.1",
    "pyramid_tm>=2.5",
    "waitress>=2.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.12",
    "transaction>=3.1",
    "zope.sqlalchemy>=1.6",
    "deform>=2.0",
    "bcrypt>=4.0",
    "pandas>=2.0,<2.2",
    "numpy>=1.24,<1.26",
    "bokeh>=3.0,<3.5",
    "plaster_pastedeploy>=1.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
testing = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "WebTest>=3.0",
    "coverage>=7.3",
    "factory-boy>=3.3",
]
development = [
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.5",
    "pre-commit>=3.4",
    "isort>=5.12",
]

[project.urls]
Homepage = "https://github.com/kivaschenko/laboratory"
Repository = "https://github.com/kivaschenko/laboratory.git"
Issues = "https://github.com/kivaschenko/laboratory/issues"
Documentation = "https://github.com/kivaschenko/laboratory#readme"

[project.scripts]
initialize_laboratory_db = "laboratory.scripts.initialize_db:main"

[project.entry-points."paste.app_factory"]
main = "laboratory:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["laboratory*"]

[tool.setuptools.package-data]
laboratory = [
    "templates/*.jinja2",
    "static/*",
    "static/**/*",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["laboratory"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["laboratory/tests.py"]
python_files = "tests.py test_*.py *_test.py"
addopts = "--strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "functional: Functional tests",
]

[tool.coverage.run]
source = ["laboratory"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
