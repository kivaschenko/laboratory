version: "3.8"

services:
  web:
    build: .
    ports:
      - "80:6543"
    environment:
      - SQLALCHEMY_URL=postgresql://laboratory:${DB_PASSWORD}@db:5432/laboratory
      - AUTH_SECRET=${AUTH_SECRET}
      - PYRAMID_DEBUG=false
      - PYRAMID_RELOAD_TEMPLATES=false
    volumes:
      - laboratory_data:/app/data
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6543/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=laboratory
      - POSTGRES_USER=laboratory
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backup:/backup
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboratory"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/ssl
      - ./static:/usr/share/nginx/html/static
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  laboratory_data:

networks:
  default:
    name: laboratory_production
