[flake8]
max-line-length = 88
extend-ignore = 
    # E203: whitespace before ':'
    E203,
    # W503: line break before binary operator
    W503,
    # E501: line too long (handled by black)
    E501
exclude = 
    .git,
    __pycache__,
    .tox,
    .eggs,
    *.egg,
    build,
    dist,
    .venv,
    venv,
    env,
    alembic/versions
per-file-ignores =
    # Allow unused imports in __init__.py files
    __init__.py:F401
    # Allow star imports in models/__init__.py
    laboratory/models/__init__.py:F403,F401

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

[mypy-pyramid.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-deform.*]
ignore_missing_imports = True

[mypy-colander.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-bokeh.*]
ignore_missing_imports = True

[mypy-bcrypt.*]
ignore_missing_imports = True

[mypy-webtest.*]
ignore_missing_imports = True

[extract_messages]
mapping_file = babel.cfg
output_file = locale/laboratory.pot
input_dirs = laboratory
keywords = _ gettext ngettext

[init_catalog]
input_file = locale/laboratory.pot
output_dir = locale
domain = laboratory

[update_catalog]
input_file = locale/laboratory.pot
output_dir = locale
domain = laboratory

[compile_catalog]
directory = locale
domain = laboratory